<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0706" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fffcf8" media="(prefers-color-scheme: light)" />
    <script>
      try {
        const theme = localStorage.getItem('portfolio-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => {
            meta.content = theme === 'light' ? '#fffcf8' : '#0b0706';
          });
        }
      } catch { /* Browser preference remains active when storage is unavailable. */ }
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
